function guiaCard(){var est=[['Diretor Presidente',/presidente/i],['Diretor de Métodos Educativos',/m[ée]todos/i],['Diretor Financeiro',/financ/i],['Diretor Administrativo',/administr/i],['Comissão Fiscal',/fiscal/i]];var h='<table class="mini"><tr><th>Cargo (Guia, nível local)</th><th>No Paxtu</th></tr>';est.forEach(function(e){var n=A.filter(function(x){return x.fun.some(function(f){return e[1].test(f[1])})});h+='<tr><td>'+e[0]+'</td><td>'+(n.length?n.map(function(x){return esc(nomeCurto(x.nome))}).join(', '):tag('at','Sem titular registrado'))+'</td></tr>'});['Filhotes','Lobinho','Escoteiro','Sênior','Pioneiro'].forEach(function(r){var ch=A.filter(function(x){return x.fun.some(function(f){return f[1]==='Chefe de Seção'&&f[2]===r})}).length,as=A.filter(function(x){return x.fun.some(function(f){return f[1]==='Assistente'&&f[2]===r})}).length;if(ch||as)h+='<tr><td>Seção '+r+'</td><td>'+(ch?ch+' chefe(s)':tag('at','Sem Chefe de Seção'))+' · '+as+' assistente(s)</td></tr>'});var apfs={};A.forEach(function(x){if(x.apf)apfs[x.apf]=1});h+='<tr><td>Assessor Pessoal de Formação</td><td>'+Object.keys(apfs).length+' APF(s) atendendo o grupo</td></tr></table>';var ab=A.filter(function(x){return x.guia.length});if(ab.length)h+='<p><b>Abaixo da idade mínima do Guia:</b></p><ul class="al">'+ab.map(function(x){return '<li><a href="#" data-f="'+esc(x.reg)+'">'+esc(x.nome)+'</a>: '+x.guia.map(esc).join('; ')+'</li>'}).join('')+'</ul>';else h+='<p class="mut">Todas as funções registradas respeitam a idade mínima do Guia.</p>';return h+'<p class="mut">Referência: Perfis: Cargos e Funções, Nível Local (set/2019) e Perfil Chefe de Seção Ramo Filhotes (16/09/2025).</p>'}

var JOV_ORD=['Passagem atrasada','Na janela de passagem','Iniciar Caminho','Acima da idade do ramo','Preparar Partida','Preparar Partida em breve','Abaixo da idade do ramo','Sem data de nascimento','No ramo'];

function semAc(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
var RAMO_NOME={filhotes:'Filhotes',lobinho:'Lobinho',escoteiro:'Escoteiro',senior:'Sênior',pioneiro:'Pioneiro'};
function nivRamo(x){
  var cursos=EV.filter(function(v){return String(v.reg)===String(x.reg)}).map(function(v){
    var a=semAc(v.atv), m=a.match(/curso\s+(intermediario|avancado|basico)/), r=a.match(/ramo\s+(filhotes|lobinho|escoteiro|senior|pioneiro)/);
    if(!m||!r)return null; return {niv:m[1]==='avancado'?'A':'I',ramo:RAMO_NOME[r[1]],d:v.d,txt:v.atv};
  }).filter(Boolean);
  var info={};
  ['I','A'].forEach(function(L){
    var dn=pd(x.cur['E'+L+'n']); if(!dn){info[L]=null;return}
    var c=cursos.filter(function(k){return k.niv===L&&k.d&&k.d<=dn}).sort(function(a,b){return b.d-a.d})[0];
    info[L]={d:x.cur['E'+L+'n'],ramo:c?c.ramo:''};
  });
  var atuais=[];x.fun.forEach(function(f){if(/Chefe de Se|Assistente/.test(f[1])&&f[2]&&atuais.indexOf(f[2])<0)atuais.push(f[2])});
  var res=atuais.map(function(R){
    var nr=semAc(R), niv=pd(x.cur.EPn)?'Preliminar':'Sem nível';
    if(info.I&&semAc(info.I.ramo)===nr)niv='Intermediário';
    if(info.A&&semAc(info.A.ramo)===nr)niv='Avançado';
    var pend=cursos.filter(function(k){return semAc(k.ramo)===nr&&!(info[k.niv]&&semAc(info[k.niv].ramo)===nr)});
    var obs=pend.length?'Curso '+(pend.some(function(k){return k.niv==='A'})?'Avançado':'Intermediário')+' do ramo feito: falta concluir o nível neste ramo':'';
    return {ramo:R,niv:niv,obs:obs};
  });
  var outros=[];['I','A'].forEach(function(L){if(info[L])outros.push((L==='A'?'Avançado':'Intermediário')+' '+(info[L].ramo?'no Ramo '+info[L].ramo:'(ramo não identificado no histórico)')+' em '+info[L].d)});
  return {atuais:res,concluidos:outros,difere:res.some(function(r){return r.niv!==x.nivel&&x.nivel!=='Preliminar'&&x.nivel!=='Sem nível'})};
}
function vJov(){

  var J=JA.filter(function(j){return (!FJ.ramo||j.ramo===FJ.ramo||j.dif===FJ.ramo)&&(!FJ.sec||j.sec===FJ.sec)}), SAIU=J0.filter(function(j){return j.saiu&&(!FJ.ramo||j.ramo===FJ.ramo)&&(!FJ.sec||j.sec===FJ.sec)});
  var filtros='<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b>Filtrar:</b>'+JOV_RAMOS.map(function(r){return '<a href="#" title="'+r+'" onclick="FJ.ramo=\''+r+'\';FJ.sec=\'\';render();return false" style="opacity:'+(FJ.ramo&&FJ.ramo!==r?'.35':'1')+'">'+ramoIco(r,30)+'</a>'}).join('')+'<select onchange="FJ.ramo=this.value;FJ.sec=\'\';render()"><option value="">Todos os ramos</option>'+JOV_RAMOS.map(function(r){return '<option'+(FJ.ramo===r?' selected':'')+'>'+r+'</option>'}).join('')+'</select><select onchange="FJ.sec=this.value;render()"><option value="">Todas as seções</option>'+secs.map(function(s){return '<option'+(FJ.sec===s?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select>'+(FJ.ramo||FJ.sec?'<button onclick="FJ.ramo=\'\';FJ.sec=\'\';render()">Limpar</button><span class="mut">'+J.length+' jovens</span>':'')+'</div>';

  [['Gerador de certificados dos Escoteiros do Brasil','Online, gera PDF','https://escoteiros.github.io/certificado/'],['Frases de Baden-Powell (repositório frases-bp)','GitHub dos Escoteiros do Brasil','https://github.com/Escoteiros/frases-bp'],['Portal de materiais dos Escoteiros do Brasil (Genially)','Fonte oficial: sempre conferir aqui','https://view.genially.com/683ef73a6fe6d4ca1996e13a'],['Programa Educativo Atualizado (página oficial)','Atualizado continuamente','https://www.escoteiros.org.br/gps-programa-educativo-atualizado/'],['Projeto Educativo dos Escoteiros do Brasil','2021','https://www.escoteiros.org.br/wp-content/uploads/2021/09/ProjetoEducativo_2021.pdf'],['Competências e Rotas de Aprendizagem: Ramo Filhotes','1ª edição, 2026','https://www.escoteiros.org.br/wp-content/uploads/2026/06/Competencias-e-Rotas-de-Aprendizagem_Ramo-Filhotes-2.pdf'],['Competências e Rotas de Aprendizagem: Ramo Lobinho','Versão 1.0, 07/03/2019','https://www.escoteiros.org.br/wp-content/uploads/2020/07/COMPETENCIAS-ESPEC%C3%8DFICAS-RAMO-LOBINHO-print.pdf'],['Competências e Rotas de Aprendizagem: Ramo Escoteiro','Versão 1.0, 07/03/2019','https://www.escoteiros.org.br/wp-content/uploads/2020/07/COMPETENCIAS-ESPEC%C3%8DFICAS-RAMO-EESCOTEIRO.pdf'],['Competências e Rotas de Aprendizagem: Ramo Sênior','Versão 1.0, 2019','https://www.escoteiros.org.br/wp-content/uploads/2020/07/COMPETENCIAS-ESPEC%C3%8DFICAS-RAMO-SENIOR.pdf'],['Competências e Rotas de Aprendizagem: Ramo Pioneiro','Versão 1.0, 2019','https://www.escoteiros.org.br/wp-content/uploads/2020/07/COMPETENCIAS-ESPEC%C3%8DFICAS-RAMO-PIONEIRO.pdf'],['Competências e Rotas de Aprendizagem: Linha Dirigente','Versão 1.0, 2019','https://www.escoteiros.org.br/wp-content/uploads/2020/07/COMPETENCIAS-ESPEC%C3%8DFICAS-DIRIGENTES-1.pdf'],['Novos Distintivos e Marcas (Caminho e Partida)','2026','https://rn.escoteiros.org.br/wp-content/uploads/sites/14/2026/03/Novos_Distintivos_e_Marcas.pdf'],['POR: Princípios, Organização e Regras (Regras 129 a 134)','Versão 2.1, abril de 2025, alterações até 31/08/2026'],['Acompanhamento e Manutenção de Competências: Ramos Lobinho, Escoteiro, Sênior e Pioneiro','2020'],['Acompanhamento e Manutenção de Competências: Linha Dirigente','2023'],['Manuais do Escotista (Filhotes a Pioneiro)','Outubro de 2025'],['Guias do Jovem (Lobinho a Pioneiro)','Novembro de 2025'],['Manual de Identidade Visual (institucional) e Manuais dos Ramos','2010 e julho de 2025']].map(function(r){return '<tr><td>'+(r[2]?'<a href="'+r[2]+'" target="_blank">'+r[0]+'</a>':r[0])+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</tbody></table>'+
  '<div class="aviso"><b>Pontos de atenção:</b><br>• Os materiais de competências são anteriores ao programa atualizado (2025): a lista de competências específicas pode mudar.<br>• O Ramo Filhotes tem caderno próprio de Competências e Rotas de Aprendizagem (1ª edição, 2026). Os outros ramos e a Linha Dirigente usam a versão 1.0, de 2019. No acompanhamento anual depois do Avançado, o Filhotes ainda usa a lista da linha Escotista.<br>• Vários adultos têm Avançado sem Intermediário registrado (sistema de formação anterior).</div>'+
  '<h3>Requisitos por nível (POR, Regra 131)</h3><dl class="dl"><dt>Preliminar</dt><dd>18 anos completos e recomendação do APF.</dd><dt>Intermediário</dt><dd>Preliminar concluído, Promessa Escoteira, registro em dia e recomendação do APF.</dd><dt>Avançado</dt><dd>Intermediário concluído, registro em dia e recomendação do APF. Ao concluir: Insígnia de Madeira.</dd></dl></div>';
}
function ficha(reg){
  var x=A.find(function(a){return String(a.reg)===String(reg)}); if(!x)return;
  var c=x.cur,linhas=[];[['E','Escotista'],['D','Dirigente']].forEach(function(l){[['P','Preliminar'],['I','Intermediário'],['A','Avançado']].forEach(function(k){var cc=c[l[0]+k[0]+'c'],nn=c[l[0]+k[0]+'n'];if(cc||nn)linhas.push(l[1]+' '+k[1]+': curso '+(cc||'sem data')+(nn?' · nível '+nn:' · '+tag('at','nível pendente')))})});
  var ev=EV.filter(function(e){return String(e.reg)===String(reg)}).sort(function(a,b){return (b.d||0)-(a.d||0)});
  var form=ev.filter(function(e){return (e.tipo==='Formação'||e.tipo==='Tarefa de formação')});
  var porAno={};ev.forEach(function(e){if(e.d){var y=e.d.getFullYear();if(y>=hoje.getFullYear()-5&&y<=hoje.getFullYear())porAno[y]=(porAno[y]||0)+1}});
  var ac=AC.filter(function(a){return String(a.reg)===String(reg)});
  document.getElementById('box').innerHTML='<button class="x" onclick="fechar()">×</button><h2 style="margin:0;color:var(--verde)">'+esc(x.nome)+' '+(x.pio?tag('in','Pioneiro'):'')+'</h2><div class="mut">Registro '+esc(x.reg)+'</div>'+
  '<div class="card" style="margin-top:10px"><dl class="dl"><dt>Funções</dt><dd>'+funTxt(x)+'</dd><dt>Nível de formação</dt><dd>'+tag(nivC(x.nivel),x.nivel)+'</dd><dt>Cursos e níveis (Paxtu)</dt><dd>'+(linhas.join('<br>')||'<span class="mut">Nenhum</span>')+'</dd>'+(x.cursoSem?'<dt>Atenção</dt><dd>'+tag('at',x.cursoSem)+'</dd>':'')+
  '<dt>APF</dt><dd>'+(x.apf?esc(x.apf):tag('at','Sem APF'))+'</dd><dt>Registro</dt><dd>'+tag(regC(x.reg_st),(x.val||'Sem data')+' · '+x.reg_st)+'</dd><dt>No escotismo desde</dt><dd>'+(x.desde?esc(x.desde)+' ('+esc(x.anos)+' anos)':'<span class="mut">Sem data</span>')+'</dd><dt>Nível por ramo (linha escotista)</dt><dd>'+(x.nr.atuais.length?x.nr.atuais.map(function(r){return '<div><b>'+esc(r.ramo)+'</b>: '+tag(nivC(r.niv),r.niv)+(r.obs?' '+tag('at',r.obs):'')+'</div>'}).join(''):'<span class="mut">Não atua como escotista em seção</span>')+(x.nr.concluidos.length?'<div class="mut">Concluídos: '+esc(x.nr.concluidos.join(' · '))+'</div>':'')+'<div class="mut">Na linha escotista o Intermediário e o Avançado valem para o ramo do curso.</div>'+'</dd><dt>Nível não concluído</dt><dd>'+(x.nivPend.length?x.nivPend.map(function(p){return tag('at','Curso '+p+' feito: falta concluir o nível')}).join(' '):'<span class="mut">Nenhum curso aguardando conclusão de nível</span>')+'</dd><dt>Eventos fora do grupo</dt><dd>'+foraTxt(x)+'</dd><dt>Guia de cargos</dt><dd>'+guiaTxt(x)+'</dd><dt>Sanção disciplinar</dt><dd>'+(x.sanc==='Ativa'?tag('al','Ativa'):tag('ok','Nenhuma ativa'))+'</dd><dt>Documentos de registro</dt><dd>'+Object.keys(x.docs).map(function(k){var s=x.docs[k];return s?tag(s==='Anexado'?'ok':s==='Pendente'?'al':'ne',k+': '+s):''}).join(' ')+'</dd><dt>Termo de consentimento</dt><dd>'+tag(x.termo==='Pendente'?'at':'ok',x.termo)+'</dd><dt>Próximo passo</dt><dd><b>'+esc(x.prox)+'</b></dd></dl></div>'+
  '<h3>Acompanhamentos de competências</h3>'+(ac.length?ac.map(function(a){return '<div class="hist"><b>'+fd(a.data)+'</b> · linha '+esc(a.linha||'')+' · APF '+esc(a.apf||'')+' <span class="mut">('+a.fonte+')</span><div>'+Object.keys(a.comp).map(function(k){return tag(a.comp[k]==='Desenvolvido'?'ok':'at',k)}).join(' ')+'</div>'+(a.ppf?'<div class="mut"><b>PPF:</b> '+esc(a.ppf)+'</div>':'')+'</div>'}).join(''):'<p class="mut">Nenhum registrado.</p>')+
  '<p><a class="btn" href="'+FORM_URL+'" target="_blank">Registrar acompanhamento</a></p>'+
  '<h3>Participação nos últimos anos</h3>'+(Object.keys(porAno).length?bars(porAno):'<p class="mut">Sem registros.</p>')+
  '<h3>Formação no histórico ('+form.length+')</h3>'+(form.length?'<table><tbody>'+form.slice(0,40).map(function(e){return '<tr><td>'+esc(e.ini)+'</td><td>'+esc(e.atv)+'</td><td class="mut">'+esc(e.loc)+'</td></tr>'}).join('')+'</tbody></table>':'<p class="mut">Nenhuma.</p>')+
  '<h3>Últimas atividades</h3><table><tbody>'+ev.filter(function(e){return e.tipo!=='Formação'}).slice(0,15).map(function(e){return '<tr><td>'+esc(e.ini)+'</td><td>'+esc(e.atv)+'</td><td class="mut">'+esc(e.tipo)+'</td></tr>'}).join('')+'</tbody></table>';
  document.getElementById('modal').classList.add('on');
}
function fechar(){document.getElementById('modal').classList.remove('on')}
function ligar(){
  document.querySelectorAll('[data-f]').forEach(function(e){e.addEventListener('click',function(ev){ev.preventDefault();ficha(e.dataset.f)})});
  document.querySelectorAll('.kpi[data-go]').forEach(function(e){e.onclick=function(){var p=e.dataset.go.split(':');F={q:'',ramo:'',nivel:'',apf:'',st:''};F[p[0]]=p[1];aba='adultos';render()}});
  var bind=function(id,obj,k,txt){var el=document.getElementById(id);if(!el)return;el[txt?'oninput':'onchange']=function(){obj[k]=el.value;render();if(txt){var n=document.getElementById(id);n.focus();n.setSelectionRange(n.value.length,n.value.length)}}};
  bind('fq',F,'q',1);bind('fapf',F,'apf');bind('framo',F,'ramo');bind('fniv',F,'nivel');bind('fst',F,'st');
  bind('eq',FE,'q',1);bind('etipo',FE,'tipo');bind('eper',FE,'per');bind('tcat',FT,'cat');bind('iano',FI,'ano');
  document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')fechar()};
}
</script>
