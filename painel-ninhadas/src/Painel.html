<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--lar:#E74E0F;--ama:#F29100;--tur:#00AA95;--mar:#945B29;--verde:#E74E0F;--verde2:#fde9df;--cinza:#FFF7EE;--borda:#f1dccb;--texto:#3a2a1e;--laranja:#e67e22;--vermelho:#c0392b;--azul:#1f6fb2}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--texto);background:var(--cinza);font-size:14px}
header{background:linear-gradient(110deg,var(--lar) 0%,var(--ama) 100%);box-shadow:0 3px 0 var(--tur);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header .marca{display:flex;align-items:center;gap:12px}
.lg-grupo{height:56px;width:56px;border-radius:50%;background:#fff;padding:2px}
.lg-fil{height:56px;background:#fff;border-radius:10px;padding:4px 6px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.3px}
header small{opacity:.85}
select,input,textarea,button{font-family:inherit;font-size:13px}
header select{padding:6px 8px;border-radius:6px;border:0}
nav{display:flex;gap:4px;padding:10px 16px 0;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--borda)}
nav button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:#55635b;border-bottom:3px solid transparent}
nav button.on{color:var(--lar);border-bottom-color:var(--lar)}
nav button:hover{color:var(--tur)}
main{padding:16px;max-width:1200px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--borda);border-top:5px solid var(--lar);border-radius:12px;padding:14px}
.card:nth-child(4n+2){border-top-color:var(--ama)}.card:nth-child(4n+3){border-top-color:var(--tur)}.card:nth-child(4n+4){border-top-color:var(--mar)}
.card:nth-child(4n+2) .n{color:var(--ama)}.card:nth-child(4n+3) .n{color:var(--tur)}.card:nth-child(4n+4) .n{color:var(--mar)}
.card .n{font-size:26px;font-weight:700;color:var(--verde)}
.card .l{font-size:12px;color:#66756c}
.box{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:16px}
.box h2{font-size:16px;margin:0 0 10px;color:var(--mar);border-left:5px solid var(--ama);padding-left:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--borda);vertical-align:top}
th{font-size:12px;color:#fff;font-weight:600;background:var(--tur)}
tr:nth-child(even) td{background:#fffaf4}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#dff5f1;color:#00806f}
.tag.amarelo{background:#fff4e0;color:#a35b00}.tag.vermelho{background:#fde8e6;color:var(--vermelho)}.tag.cinza{background:#eceeed;color:#66756c}.tag.azul{background:#e3effa;color:var(--azul)}
.btn{background:var(--verde);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}
.btn:disabled{opacity:.5}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.linha input,.linha select,.linha textarea{padding:7px 8px;border:1px solid var(--borda);border-radius:6px}
.muted{color:#7a877f;font-size:12px}
.etapas{display:flex;gap:6px;flex-wrap:wrap}
.et b{display:flex;align-items:center}
.et{border:2px solid var(--c,var(--borda));border-radius:10px;padding:6px 8px;min-width:90px;font-size:12px;background:#fff}
.et b{color:var(--c)}
.et-Paco{--c:#00AA95}.et-Tixa{--c:#945B29}.et-Lipe{--c:#E74E0F}.et-Nina{--c:#F29100}
.et b{display:block}
.bar{height:6px;background:#eceeed;border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--lar))}
.bloco{border:1px solid var(--borda);border-left:4px solid var(--ama);border-radius:10px;padding:10px;margin-bottom:10px}
.bloco h3{font-size:13px;margin:0 0 6px}
.item{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.item input{margin-top:3px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#24302a;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.carregando{padding:40px;text-align:center;color:#66756c}
.chamada td{white-space:nowrap}
.chamada input[type=text]{width:100%;min-width:160px}
@media (max-width:700px){th:nth-child(n+5),td:nth-child(n+5){display:none}.chamada th,.chamada td{display:table-cell}}
.tl{display:flex;flex-wrap:wrap;gap:8px}.tl-i{flex:1;min-width:110px;background:#f6f1ec;border-radius:10px;padding:10px;text-align:center;opacity:.6}.tl-i.ok{background:#fff4e0;opacity:1;border:1px solid var(--ama)}.tl-i b{display:block;font-size:13px;color:var(--mar)}.tl-i span{font-size:12px}.tl-p{width:12px;height:12px;border-radius:50%;background:#ccc;margin:0 auto 6px}.tl-i.ok .tl-p{background:var(--lar)}
</style>
</head>
<body>
<header>
  <div class="marca"><div><h1>Painel das Ninhadas</h1><small>Ramo Filhotes · <?!= CONFIG.NOME_GRUPO ?> · <span id="hoje"></span></small></div></div>
  <div class="marca"><select id="filtro" onchange="render()"><option value="">Todas</option><? Object.keys(CONFIG.SECOES_PAXTU).forEach(function (n) { ?><option><?= n ?></option><? }); ?></select></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="carregando">Carregando...</div></main>
<div id="msg"></div>
<script>
var D=null, ABA='geral', SEL=null;
var ABAS=[['geral','Visão geral'],['filhotes','Filhotes'],['ficha','Ficha do Filhote'],['progressao','Progressão'],['presenca','Presença'],['atividades','Atividades'],['financeiro','Financeiro'],['cmdca','Verba CMDCA'],['documentos','Documentos'],['pergunte','Pergunte']];
var ETAPAS=['Paco','Tixa','Lipe','Nina'];
function bicho(e,h){return '<img src="https://paxtu100-public-assets.s3.us-east-1.amazonaws.com/new-progression/bloco-'+e.toLowerCase()+'.svg" alt="'+e+'" style="height:'+(h||22)+'px;vertical-align:middle;margin-right:4px">'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(function(){m.style.display='none'},3500)}
function erro(e){msg('Erro: '+(e&&e.message||e))}
function carregar(){google.script.run.withSuccessHandler(function(d){D=d;document.getElementById('hoje').textContent=d.hoje;render()}).withFailureHandler(erro).getDados()}
function chama(fn,args,ok){var r=google.script.run.withSuccessHandler(function(t){msg(t);if(ok)ok();carregar()}).withFailureHandler(erro);r[fn].apply(r,args)}
function fil(){var f=document.getElementById('filtro').value;return D.filhotes.filter(function(x){return!f||x.ninhada===f})}
function codsFil(){var o={};fil().forEach(function(x){o[x.cod]=1});return o}
function tagSit(s){var c=/Vencido|sem registro|Sem cadastro/i.test(s)?'vermelho':/Vence neste ano|Sem validade/.test(s)?'amarelo':/Isento|idade mínima/.test(s)?'cinza':'';return '<span class="tag '+c+'">'+esc(s)+'</span>'}
function money(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}
function nav(){document.getElementById('nav').innerHTML=ABAS.map(function(a){return '<button class="'+(a[0]===ABA?'on':'')+'" onclick="ABA=\''+a[0]+'\';SEL=null;render()">'+a[1]+'</button>'}).join('')}
function render(){nav();if(!D)return;var f={geral:vGeral,filhotes:vFilhotes,ficha:vFicha,progressao:vProgressao,presenca:vPresenca,atividades:vAtividades,financeiro:vFinanceiro,cmdca:vCmdca,documentos:vDocumentos,pergunte:vPergunte}[ABA];document.getElementById('main').innerHTML=f();if(ABA==='presenca')montaChamada()}

/* ---- cálculos ---- */
function presencaDe(cod){var p=0,j=0,f=0;D.presenca.forEach(function(x){if(x.cod!==cod)return;if(x.estado==='Presente')p++;else if(x.estado==='Falta justificada')j++;else if(x.estado==='Falta')f++});
  return{p:p,j:j,f:f,sem:(p+f)?Math.round(100*p/(p+f)):null,com:(p+f+j)?Math.round(100*p/(p+f+j)):null}}
function itensFeitos(cod){var o={};D.progressao.forEach(function(x){if(x.cod===cod)o[x.item]=x});return o}
function blocos(){var b={};D.itens.forEach(function(i){var k=i.codBloco;if(!b[k])b[k]={etapa:i.etapa,bloco:i.bloco,minimo:i.minimo,itens:[]};b[k].itens.push(i)});return Object.keys(b).sort(function(a,c){return a-c}).map(function(k){return b[k]})}
function etapaResumo(cod){var feitos=itensFeitos(cod),r={};ETAPAS.forEach(function(e){r[e]={ok:0,tot:0}});
  blocos().forEach(function(b){var n=b.itens.filter(function(i){return feitos[i.cod]}).length;r[b.etapa].tot++;if(b.minimo&&n>=b.minimo)r[b.etapa].ok++});return r}
function pendencias(){var pag={},out=[];D.financeiro.forEach(function(x){if(x.tipo==='Entrada'&&x.situacao==='Pago'&&x.atividade)pag[x.cod+'|'+x.atividade]=(pag[x.cod+'|'+x.atividade]||0)+x.valor});
  var nomes={};D.filhotes.forEach(function(x){nomes[x.cod]=x});
  D.atividades.forEach(function(a){var t=Number(a.taxa)||0;if(!t||a.situacao==='Cancelada')return;
    D.presenca.forEach(function(p){if(p.data!==a.iso||p.estado!=='Presente')return;var pessoas=1+(p.acomp||0),dev=t*pessoas,pago=pag[p.cod+'|'+a.titulo]||0;if(pago<dev)out.push({cod:p.cod,nome:(nomes[p.cod]||{}).nome||p.cod,atividade:a.titulo+' ('+pessoas+(pessoas>1?' participantes':' participante')+')',data:a.data,valor:dev-pago})})});
  D.financeiro.forEach(function(x){if(x.tipo==='Cobrança'&&x.situacao==='Pendente')out.push({cod:x.cod,nome:x.filhote,atividade:x.descricao||x.atividade,data:x.data,valor:x.valor})});
  return out}
function caixa(){var c=0;D.financeiro.forEach(function(x){if(x.situacao!=='Pago')return;if(x.tipo==='Entrada')c+=x.valor;else if(x.tipo==='Saída')c-=x.valor});return c}

/* ---- visão geral ---- */
function vGeral(){var F=fil(),cods=codsFil();
  var renovar=F.filter(function(x){return/^Sim/.test(x.renovar)}).length;
  var falta=D.progressao.filter(function(x){return cods[x.cod]&&x.paxtu==='Falta lançar'}).length;
  var prox=D.atividades.filter(function(a){return!a.passada&&a.situacao!=='Sem atividade'&&a.situacao!=='Cancelada'}).slice(0,4);
  var semPx=D.atividades.filter(function(a){return a.passada&&a.situacao==='Realizada'&&a.paxtu!=='Cadastrada'&&a.paxtu!=='Não se aplica'}).length;
  var pend=pendencias().filter(function(p){return cods[p.cod]});
  var tp=0,tt=0;F.forEach(function(x){var p=presencaDe(x.cod);tp+=p.p;tt+=p.p+p.f});
  var hj=new Date();hj.setHours(0,0,0,0);
  var semCad=D.atividades.filter(function(a){if(a.passada||!a.iso||a.situacao==='Sem atividade'||a.situacao==='Cancelada'||a.paxtu==='Cadastrada'||a.paxtu==='Não se aplica')return false;var d=(new Date(a.iso+'T00:00:00')-hj)/864e5;return d>=0&&d<=7});
  var aviso=semCad.length?'<div class="box" style="border-left:5px solid #c0392b;background:#fff4f2"><h2 style="color:#c0392b">Atenção: atividade sem cadastro no Paxtu</h2>'+semCad.map(function(a){return '<p><b>'+esc(a.data)+'</b>: '+esc(a.titulo)+' · <a href="#" onclick="ABA=\'atividades\';abrePx('+a.linha+');return false">cadastrar no Paxtu</a></p>'}).join('')+'<p class="muted">Atividades dos próximos 7 dias que ainda não estão no Paxtu.</p></div>':'';
  return aviso+'<div class="cards">'+card(F.length,'Filhotes')+card(renovar,'Precisam renovar para 2027')+card(tt?Math.round(100*tp/tt)+'%':'-','Presença média (sem justificadas)')+card(falta,'Itens de progressão falta lançar no Paxtu')+card(semPx,'Atividades realizadas sem cadastro no Paxtu')+card(money(pend.reduce(function(s,p){return s+p.valor},0)),'Pendências das famílias')+'</div>'+
  vMeses()+'<div class="box"><h2>Próximas atividades</h2>'+(prox.length?'<table><tr><th>Data</th><th>Atividade</th><th>Local</th><th>Taxa</th><th>Autorização</th></tr>'+prox.map(function(a){return '<tr><td>'+esc(a.data)+'</td><td>'+esc(a.titulo)+' '+(a.tipo==='Grupo'?'<span class="tag azul">Grupo</span>':'')+'</td><td>'+esc(a.local)+'</td><td>'+(a.taxa===''?'-':money(a.taxa))+'</td><td>'+esc(a.autorizacao||'Não')+'</td></tr>'}).join('')+'</table>':'<p class="muted">Nenhuma atividade prevista.</p>')+'</div>'}
function vMeses(){var M=D.meses||[];if(!M.length)return '';var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var rows=M.map(function(m,i){var ant=M[i-1],ent=[],sai=[];if(ant){ent=m.cods.filter(function(c){return ant.cods.indexOf(c)<0}).map(function(c){return m.nomes[c]||c});sai=ant.cods.filter(function(c){return m.cods.indexOf(c)<0}).map(function(c){return ant.nomes[c]||c})}
    else{(D.fichas||[]).forEach(function(f){var e=String(f.entrada||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);if(e&&e[3]+'-'+e[2]===m.mes&&m.cods.indexOf(f.cod)>=0)ent.push(f.nome)})}
    var p=m.mes.split('-');return '<tr><td><b>'+MES[+p[1]-1]+'/'+p[0]+'</b></td><td>'+m.ativos+'</td><td>'+(ent.length?'<span class="tag">+'+ent.length+'</span> '+esc(ent.join(', ')):'-')+'</td><td>'+(sai.length?'<span class="tag vermelho">-'+sai.length+'</span> '+esc(sai.join(', ')):'-')+'</td></tr>'}).reverse().slice(0,12).join('');
  return '<div class="box"><h2>Números do mês</h2><table><tr><th>Mês</th><th>Ativos</th><th>Entraram</th><th>Saíram</th></tr>'+rows+'</table><p class="muted">Contado a partir dos Filhotes no Paxtu. O registro começou em '+(function(p){return MES[+p[1]-1]+'/'+p[0]})(M[0].mes.split('-'))+'; quem deixa de constar no Paxtu aparece em Saíram no mês em que saiu.</p></div>'}
var PERG={q:'',res:null,carregando:false,hist:[]};
function vPergunte(){var r=PERG.res;
  return '<div class="box"><h2>Pergunte</h2><p class="muted">Tire dúvidas sobre regras e orientações do Movimento. A resposta usa só os documentos oficiais da pasta "Documentos de consulta" (POR, Estatuto, resoluções do CAN e materiais do Ramo Filhotes) e cita a fonte. Confira sempre no documento antes de decidir algo importante.</p>'+
  '<textarea id="pgQ" rows="3" style="width:100%" placeholder="Ex.: Qual a idade mínima para entrar no Ramo Filhotes? Quantos adultos precisa ter numa atividade externa?">'+esc(PERG.q)+'</textarea>'+
  '<div class="linha" style="margin-top:6px"><button class="btn" '+(PERG.carregando?'disabled':'')+' onclick="pergunta()">'+(PERG.carregando?'Consultando os documentos...':'Perguntar')+'</button></div>'+
  (r?'<div style="background:#fffaf4;border-radius:8px;padding:12px;margin-top:12px;white-space:pre-wrap">'+fmtResp(r.resposta)+'</div>'+
    (r.fontes&&r.fontes.length?'<p style="margin-top:10px"><b>Trechos consultados</b></p>'+r.fontes.map(function(f){return '<div class="muted">['+f.n+'] '+esc(f.doc)+(f.ref?' · '+esc(f.ref):'')+' · <a href="'+esc(f.arquivo)+'" target="_blank">abrir no Drive</a>'+(f.fonte&&f.fonte!==f.arquivo?' · <a href="'+esc(f.fonte)+'" target="_blank">site oficial</a>':'')+'</div>'}).join(''):''):'')+
  (PERG.hist.length?'<p style="margin-top:14px"><b>Perguntas desta sessão</b></p>'+PERG.hist.map(function(h,i){return '<div><a href="#" onclick="PERG.q=PERG.hist['+i+'].q;PERG.res=PERG.hist['+i+'].r;render();return false">'+esc(h.q)+'</a></div>'}).join(''):'')+'</div>'}
function fmtResp(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[\*\-] /gm,'• ')}
function pergunta(){var q=document.getElementById('pgQ').value.trim();if(q.length<5){msg('Escreva a pergunta.');return}PERG.q=q;PERG.carregando=true;PERG.res=null;render();
  google.script.run.withSuccessHandler(function(r){PERG.carregando=false;PERG.res=r;PERG.hist=[{q:q,r:r}].concat(PERG.hist.filter(function(h){return h.q!==q})).slice(0,8);render()}).withFailureHandler(function(e){PERG.carregando=false;render();erro(e)}).perguntarConsulta(q)}
function card(n,l){return '<div class="card"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}

/* ---- filhotes ---- */
function vFilhotes(){var F=fil();
  return '<div class="box"><h2>Filhotes ('+F.length+')</h2><table><tr><th>Nome</th><th>Ninhada</th><th>Registro</th><th>Validade</th><th>Situação</th><th>Renovar 2027</th><th>Idade</th><th>Responsáveis</th></tr>'+
  F.map(function(x){return '<tr><td><a href="#" onclick="FICHA=\''+x.cod+'\';ABA=\'ficha\';render();return false"><b>'+esc(x.nome)+'</b></a></td><td>'+esc(x.ninhada)+'</td><td>'+esc(x.registro)+'</td><td>'+esc(x.validade)+'</td><td>'+tagSit(x.situacao)+'</td><td>'+esc(x.renovar)+'</td><td>'+esc(x.idade)+'</td><td>'+
    esc(x.resp1)+(x.par1?' ('+esc(x.par1)+')':'')+'<br><span class="muted">'+esc(x.cont1)+' '+esc(x.email1)+'</span>'+(x.resp2?'<br>'+esc(x.resp2)+(x.par2?' ('+esc(x.par2)+')':'')+'<br><span class="muted">'+esc(x.cont2)+' '+esc(x.email2)+'</span>':'')+'</td></tr>'}).join('')+'</table>'+
  '<p class="muted">Dados do Paxtu, atualizados em '+esc((F[0]||{}).atualizado||'-')+'. Menores de 5 anos aparecem como Abaixo da idade mínima.</p></div>'+vRenovacao(F)+vFila()}
var DIAS_SEM=['Domingo','2ª Feira','3ª Feira','4ª Feira','5ª Feira','6ª Feira','Sábado'];
function dBR(d){return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' ('+DIAS_SEM[d.getDay()]+')'}
function parseBR(t){var m=String(t||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function primeiro(n){return String(n||'').trim().split(/\s+/)[0]||''}
function foneWa(c){var d=String(c||'').replace(/\D/g,'');if(d.length>11&&d.slice(0,2)==='55')d=d.slice(2);return (d.length===10||d.length===11)?'55'+d:''}
function msgRenov(x,dias,venc){var t='Olá, '+primeiro(x.resp1)+'! Tudo bem?\n\n';
  t+=dias<0?'O registro escoteiro de *'+primeiro(x.nome)+'* venceu em *'+dBR(venc)+'*.':dias===0?'O registro escoteiro de *'+primeiro(x.nome)+'* vence *hoje*, '+dBR(venc)+'.':'O registro escoteiro de *'+primeiro(x.nome)+'* vence em *'+dBR(venc)+'*, daqui a '+dias+' dia'+(dias>1?'s':'')+'.';
  t+='\n\n'+(dias>0?'A renovação é feita direto pelo Paxtu, em *Registro individual*, no menu de navegação.':'Como o registro já venceu, a renovação não é mais feita direto pelo Paxtu: entre em contato com a chefia ou a diretoria do grupo que nós ajudamos.');
  t+='\n\nO registro em dia garante o seguro de acidentes pessoais e a participação nas atividades.\n\n_Se o registro já foi renovado, pode desconsiderar esta mensagem._\n\n<?!= CONFIG.ASSINATURA_MENSAGENS ?>';return t}
function vRenovacao(F){var hj=new Date();hj.setHours(0,0,0,0);
  var L=F.map(function(x){var v=parseBR(x.validade);if(!v)return null;var d=Math.round((v-hj)/864e5);return d<=30?{x:x,v:v,d:d}:null}).filter(Boolean).sort(function(a,b){return a.d-b.d});
  if(!L.length)return '<div class="box"><h2>Renovação de registro</h2><p class="muted">Nenhum registro vence nos próximos 30 dias.</p></div>';
  return '<div class="box"><h2>Renovação de registro</h2><p class="muted">Registros vencidos ou que vencem nos próximos 30 dias. O botão abre o WhatsApp do responsável com a mensagem pronta; confira e envie.</p><table><tr><th>Filhote</th><th>Validade</th><th>Situação</th><th>Responsável</th><th></th></tr>'+

/* ---- ficha do Filhote ---- */
var FICHA=null;
function semAc(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function fichaPx(x){var fs=D.fichas||[];return fs.filter(function(f){return f.cod===x.cod})[0]||fs.filter(function(f){return semAc(f.nome)===semAc(x.nome)})[0]||null}
function linhaF(r,v,alerta){return '<tr><td style="width:190px"><b>'+r+'</b></td><td>'+(v?(alerta?'<span class="tag vermelho">'+esc(v)+'</span>':esc(v)):'<span class="muted">Nada informado</span>')+'</td></tr>'}
function vFicha(){var F=fil();if(!FICHA||!F.some(function(x){return x.cod===FICHA}))FICHA=F.length?F[0].cod:null;
  var sel='<div class="box no-print"><div class="linha"><b>Filhote:</b><select onchange="FICHA=this.value;render()">'+F.map(function(x){return '<option value="'+esc(x.cod)+'" '+(x.cod===FICHA?'selected':'')+'>'+esc(x.nome)+'</option>'}).join('')+'</select><button class="btn sec" onclick="imprimeFicha()">Imprimir ficha</button></div></div>';
  var x=D.filhotes.filter(function(f){return f.cod===FICHA})[0];if(!x)return sel+'<div class="box">Nenhum Filhote.</div>';
  var fp=fichaPx(x)||{},r=etapaResumo(x.cod),feitos=itensFeitos(x.cod),p=presencaDe(x.cod);
  // linha do tempo
  var tl=[['Entrada no grupo',fp.entrada]].concat(['Acolhida','Paco','Tixa','Lipe','Nina','Caminho Lobinho'].map(function(k){return [k,x.conquistas[k]]}));
  var tempo='<div class="tl">'+tl.map(function(t){return '<div class="tl-i '+(t[1]?'ok':'')+'"><div class="tl-p"></div><b>'+t[0]+'</b><span>'+(t[1]?esc(t[1]):'ainda não')+'</span></div>'}).join('')+'</div>';
  // etapa atual e o que falta
  var bs=blocos(),atual=null;bs.forEach(function(b){var n=b.itens.filter(function(i){return feitos[i.cod]}).length;if(!atual&&!(b.minimo&&n>=b.minimo))atual={b:b,n:n}});
  var falta=atual?'<p><b>Bloco atual:</b> '+bicho(atual.b.etapa,20)+esc(atual.b.etapa)+' · '+esc(atual.b.bloco)+' ('+atual.n+' de '+atual.b.minimo+')</p><ul>'+atual.b.itens.filter(function(i){return !feitos[i.cod]}).map(function(i){return '<li>'+esc(i.item)+'</li>'}).join('')+'</ul>':'<p>Todos os blocos completos.</p>';
  var etap='<div class="etapas">'+ETAPAS.map(function(e){var q=r[e];return '<div class="et et-'+e+'"><b>'+bicho(e,20)+e+'</b>'+q.ok+'/'+q.tot+'<div class="bar"><i style="width:'+(q.tot?100*q.ok/q.tot:0)+'%"></i></div></div>'}).join('')+'</div>';
  // presença
  var at={};D.atividades.forEach(function(a){at[a.iso]=a});
  var ps=D.presenca.filter(function(q){return q.cod===x.cod}).sort(function(a,b){return a.data<b.data?1:-1});
  var pres='<p>Presenças: <b>'+p.p+'</b> · Justificadas: <b>'+p.j+'</b> · Faltas: <b>'+p.f+'</b> · Sem justificadas: <b>'+(p.sem==null?'-':p.sem+'%')+'</b> · Contando todas: <b>'+(p.com==null?'-':p.com+'%')+'</b></p>'+
    (ps.length?'<table><tr><th>Data</th><th>Atividade</th><th>Situação</th><th>Familiares</th></tr>'+ps.map(function(q){var a=at[q.data]||{};return '<tr><td>'+esc(a.data||q.data)+'</td><td>'+esc(q.atividade||a.titulo)+'</td><td>'+(q.estado==='Presente'?'<span class="tag">Presente</span>':q.estado==='Falta'?'<span class="tag vermelho">Falta</span>':'<span class="tag amarelo">Justificada</span>'+(q.motivo?' <span class="muted">'+esc(q.motivo)+'</span>':''))+'</td><td>'+(q.acomp||'-')+'</td></tr>'}).join('')+'</table>':'<p class="muted">Nenhuma chamada registrada.</p>');
  // financeiro
  var pend=pendencias().filter(function(q){return q.cod===x.cod}),pagos=D.financeiro.filter(function(f){return f.cod===x.cod&&f.tipo==='Entrada'&&f.situacao==='Pago'});
  var fin='<p>Pago: <b>'+money(pagos.reduce(function(s,f){return s+f.valor},0))+'</b> · Pendente: <b>'+money(pend.reduce(function(s,f){return s+f.valor},0))+'</b></p>'+
    (pend.length?'<ul>'+pend.map(function(q){return '<li><span class="tag vermelho">'+money(q.valor)+'</span> '+esc(q.atividade)+'</li>'}).join('')+'</ul>':'');
  // documentos
  var dd={};D.documentos.forEach(function(d){if(d.cod===x.cod)dd[d.documento]=d});
  var docs=DOCS.map(function(d){var e=dd[d]&&dd[d].situacao==='Entregue';return '<span class="tag '+(e?'':'amarelo')+'">'+d+': '+(e?'Entregue':'Pendente')+'</span>'}).join(' ');
  // saúde
  var saude=D.fichas&&D.fichas.length?(fichaPx(x)?'<table>'+linhaF('Alergias',fp.alergias,true)+linhaF('Restrição alimentar',fp.restricao,true)+linhaF('Medicamentos',fp.meds,true)+linhaF('Condições de saúde',fp.condicoes,true)+
    linhaF('Cuidados no dia a dia',fp.cuidados,false)+linhaF('Acompanhamento médico',fp.acomp,false)+linhaF('Tipo sanguíneo',fp.sangue,false)+linhaF('Plano de saúde',fp.plano,false)+'</table><p class="muted">Ficha médica do Paxtu, atualizada em '+esc(fp.atualizado)+'. Correções são feitas no Paxtu.</p>':'<p class="muted">Este Filhote não está no Paxtu, então não tem ficha médica.</p>'):'<p class="muted">A ficha médica ainda não foi lida do Paxtu.</p>';
  return sel+'<div id="fichaImp">'+
  '<div class="box"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1"><h2 style="margin:0">'+esc(x.nome)+'</h2><p class="muted" style="margin:4px 0 0">'+esc(x.ninhada)+' · '+esc(x.idade)+' anos · nascimento '+esc(x.nasc)+'</p></div><div>'+tagSit(x.situacao)+' <span class="muted">validade '+esc(x.validade||'-')+'</span></div></div>'+
  '<p style="margin:10px 0 0">'+esc(x.resp1)+(x.par1?' ('+esc(x.par1)+')':'')+' · '+esc(x.cont1)+' · '+esc(x.email1)+(x.resp2?'<br>'+esc(x.resp2)+(x.par2?' ('+esc(x.par2)+')':'')+' · '+esc(x.cont2)+' · '+esc(x.email2):'')+'</p></div>'+
  '<div class="box" style="border-left:5px solid var(--vermelho)"><h2>Saúde e alimentação</h2>'+saude+'</div>'+
  '<div class="box"><h2>Vida escoteira</h2>'+tempo+'</div>'+
  '<div class="box"><h2>Progressão</h2>'+etap+falta+'</div>'+
  '<div class="box"><h2>Presença</h2>'+pres+'</div>'+
  '<div class="box"><h2>Financeiro da família</h2>'+fin+'</div>'+
  '<div class="box"><h2>Documentos</h2>'+docs+'</div>'+
  (x.obs?'<div class="box"><h2>Observações da chefia</h2><p>'+esc(x.obs)+'</p></div>':'')+'</div>'}
function imprimeFicha(){var w=window.open('','_blank');w.document.write('<html><head><title>Ficha do Filhote</title><style>'+document.querySelector('style').innerHTML+'body{background:#fff}</style></head><body><h3 style="font-family:Montserrat,Arial;color:#E74E0F">Ramo Filhotes · <?!= CONFIG.NOME_GRUPO ?> · Ficha do Filhote · uso exclusivo da chefia</h3>'+document.getElementById('fichaImp').innerHTML+'</body></html>');w.document.close();setTimeout(function(){w.print()},600)}

/* ---- verba CMDCA 2027 ---- */
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var CATS=['Alimentação','Material de Atividade','Combustível','Aluguel de Van ou Ônibus','Outros'];
var SITNF=['A enviar','Enviada ao financeiro','Paga','Devolvida'];
var MESCM=null,MESAB={};
function usadaNF(n){return n.situacao!=='Devolvida'}
function vCmdca(){var C=D.cmdca;if(!C)return '<div class="box"><h2>Verba CMDCA 2027</h2><p class="muted">As abas da verba ainda não foram criadas na planilha.</p></div>';
  var hoje=new Date(),mesAt=hoje.getFullYear()===2027?hoje.getMonth()+1:(hoje.getFullYear()<2027?0:12);
  var notas=C.notas.filter(function(n){return n.iso&&n.iso.slice(0,4)==='2027'});
  var usado=notas.filter(usadaNF).reduce(function(s,n){return s+n.valor},0);
  var prevAte=C.plan.filter(function(p){return p.mes<=mesAt}).reduce(function(s,p){return s+p.valor},0);
  var usadoAte=notas.filter(function(n){return usadaNF(n)&&n.mes<=mesAt}).reduce(function(s,n){return s+n.valor},0);
  var aEnviar=notas.filter(function(n){return n.situacao==='A enviar'}).length,semLink=notas.filter(function(n){return usadaNF(n)&&!n.link}).length;
  var porMes=MESES.map(function(m,i){var pl=C.plan.filter(function(p){return p.mes===i+1}),pv=pl.reduce(function(s,p){return s+p.valor},0),
    us=notas.filter(function(n){return usadaNF(n)&&n.mes===i+1}).reduce(function(s,n){return s+n.valor},0);return {i:i+1,nome:m,prev:pv,usado:us,cobre:(pl[0]||{}).cobre||''}});
  var porCat=CATS.map(function(c){var pv=C.plan.filter(function(p){return p.categoria===c}).reduce(function(s,p){return s+p.valor},0),us=notas.filter(function(n){return usadaNF(n)&&n.categoria===c}).reduce(function(s,n){return s+n.valor},0);return {c:c,prev:pv,usado:us}}).filter(function(x){return x.prev||x.usado});
  var opA=D.atividades.filter(function(a){return a.iso&&a.iso.slice(0,4)==='2027'&&a.situacao!=='Sem atividade'}).map(function(a){return '<option>'+esc(a.data.split(' ')[0]+' · '+a.titulo)+'</option>'}).join('');
  function barra(u,p){var pc=p?Math.min(100,100*u/p):(u?100:0);return '<div class="bar"><i style="width:'+pc+'%;'+(u>p?'background:var(--vermelho)':'')+'"></i></div>'}
  var mesSel=MESCM||mesAt||1,doMes=notas.filter(function(n){return n.mes===mesSel});
  return '<div class="cards">'+card(money(C.total),'Verba 2027 para os Filhotes')+card(money(usado),'Usado (notas enviadas)')+card(money(C.total-usado),'Saldo da verba')+card(money(prevAte-usadoAte),mesAt?'Previsto e não usado até '+MESES[mesAt-1]:'Previsto até o mês atual')+'</div>'+
  (aEnviar||semLink?'<div class="box" style="border-left:5px solid var(--vermelho)"><b>Atenção:</b> '+(aEnviar?aEnviar+' nota(s) ainda não enviadas ao financeiro. ':'')+(semLink?semLink+' nota(s) sem o link do arquivo.':'')+'</div>':'')+
    '<div class="box"><h2>Planejado x usado por mês</h2><p class="muted">Clique no mês para ver cada categoria.</p><table><tr><th>Mês</th><th>Previsto</th><th>Usado</th><th>Diferença</th></tr>'+
  porMes.map(function(m){var d=m.prev-m.usado,cor=m.usado>m.prev?'vermelho':(m.i<mesAt&&m.prev&&!m.usado?'amarelo':''),ab=MESAB[m.i];
    var linha='<tr style="cursor:pointer;'+(m.i===mesAt?'background:#fff4e0':'')+'" onclick="MESAB['+m.i+']=!MESAB['+m.i+'];render()"><td><b>'+(ab?'▾ ':'▸ ')+m.nome+'</b>'+(m.i===mesAt?' <span class="tag">mês atual</span>':'')+'</td><td>'+money(m.prev)+'</td><td>'+money(m.usado)+barra(m.usado,m.prev)+'</td><td>'+(cor?'<span class="tag '+cor+'">'+money(d)+'</span>':money(d))+'</td></tr>';
    if(!ab)return linha;
    var cats=CATS.map(function(c){var pv=C.plan.filter(function(p){return p.mes===m.i&&p.categoria===c}).reduce(function(s,p){return s+p.valor},0),
      ns=notas.filter(function(n){return usadaNF(n)&&n.mes===m.i&&n.categoria===c}),us=ns.reduce(function(s,n){return s+n.valor},0);return {c:c,prev:pv,usado:us,ns:ns}}).filter(function(x){return x.prev||x.usado});
    var det='<tr><td colspan="4" style="background:#fffaf4;padding:8px 14px 12px 28px">'+(cats.length?'<table><tr><th>Categoria</th><th>Previsto</th><th>Usado</th><th>Restante</th><th>Notas</th></tr>'+cats.map(function(x){var r=x.prev-x.usado;
      return '<tr><td>'+esc(x.c)+'</td><td>'+money(x.prev)+'</td><td>'+money(x.usado)+'</td><td>'+(r<0?'<span class="tag vermelho">'+money(r)+'</span>':money(r))+'</td><td class="muted">'+(x.ns.length?x.ns.map(function(n){return esc(n.data)+' · '+esc(n.fornecedor||'-')+' · '+money(n.valor)}).join('<br>'):'-')+'</td></tr>'}).join('')+'</table>':'<p class="muted">Nada previsto para este mês.</p>')+
      (m.cobre?'<p class="muted" style="margin:6px 0 0"><b>Planejado:</b> '+esc(m.cobre)+'</p>':'')+'</td></tr>';
    return linha+det}).join('')+
  '<tr><td><b>Total</b></td><td><b>'+money(C.total)+'</b></td><td><b>'+money(usado)+'</b></td><td><b>'+money(C.total-usado)+'</b></td></tr></table><p class="muted">Vermelho: gastou mais que o previsto. Amarelo: mês que já passou sem nenhuma nota.</p></div>'+
'<div class="box"><h2>Por categoria</h2><table><tr><th>Categoria</th><th>Previsto no ano</th><th>Usado</th><th>Restante</th></tr>'+porCat.map(function(x){return '<tr><td>'+esc(x.c)+'</td><td>'+money(x.prev)+'</td><td>'+money(x.usado)+barra(x.usado,x.prev)+'</td><td>'+(x.usado>x.prev?'<span class="tag vermelho">'+money(x.prev-x.usado)+'</span>':money(x.prev-x.usado))+'</td></tr>'}).join('')+'</table></div>'+
  '<div class="box"><h2>Lançar nota fiscal</h2><div class="linha"><input type="date" id="nfD"><select id="nfC">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><select id="nfA"><option value="">(atividade)</option>'+opA+'</select><input id="nfF" placeholder="Fornecedor"><input id="nfN" placeholder="Nº da NF" style="width:100px"><input id="nfV" placeholder="Valor" style="width:100px"><input id="nfL" placeholder="Link do arquivo da NF"><select id="nfS">'+SITNF.slice(0,2).map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><button class="btn" onclick="lancaNF()">Salvar</button></div>'+

  '<div class="box"><h2>Notas do mês</h2><div class="linha"><select onchange="MESCM=Number(this.value);render()">'+MESES.map(function(m,i){return '<option value="'+(i+1)+'" '+(i+1===mesSel?'selected':'')+'>'+m+'</option>'}).join('')+'</select><button class="btn sec" onclick="imprimeMes()">Imprimir relatório do mês</button></div>'+
  '<div id="relMes">'+(doMes.length?'<table><tr><th>Data</th><th>Categoria</th><th>Atividade</th><th>Fornecedor</th><th>NF</th><th>Valor</th><th>Arquivo</th><th>Situação</th></tr>'+doMes.map(function(n){return '<tr><td>'+esc(n.data)+'</td><td>'+esc(n.categoria)+'</td><td>'+esc(n.atividade)+'</td><td>'+esc(n.fornecedor)+'</td><td>'+esc(n.nf)+'</td><td>'+money(n.valor)+'</td><td>'+(n.link?'<a href="'+esc(n.link)+'" target="_blank">abrir</a>':'<a href="#" onclick="linkNF('+n.linha+');return false"><span class="tag vermelho">incluir link</span></a>')+'</td><td><select onchange="chama(\'situacaoNotaCMDCA\',['+n.linha+',this.value])">'+SITNF.map(function(s){return '<option '+(n.situacao===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')+
  '<tr><td colspan="5"><b>Total do mês</b></td><td><b>'+money(doMes.filter(usadaNF).reduce(function(s,n){return s+n.valor},0))+'</b></td><td colspan="2">Previsto: '+money(porMes[mesSel-1].prev)+'</td></tr></table>':'<p class="muted">Nenhuma nota neste mês.</p>')+'</div></div>'}
function lancaNF(){var o={iso:document.getElementById('nfD').value,categoria:document.getElementById('nfC').value,atividade:document.getElementById('nfA').value,fornecedor:document.getElementById('nfF').value,
  nf:document.getElementById('nfN').value,valor:document.getElementById('nfV').value,link:document.getElementById('nfL').value,situacao:document.getElementById('nfS').value};
  if(!o.iso||!o.valor){msg('Informe a data e o valor da nota.');return}if(o.iso.slice(0,4)!=='2027'){msg('A verba é de 2027: confira a data da nota.');return}chama('lancarNotaCMDCA',[o])}
function linkNF(l){var u=prompt('Cole o link do arquivo da nota (Drive):');if(u)chama('linkNotaCMDCA',[l,u])}
